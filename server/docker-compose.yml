# Solo para desarrollo LOCAL contra un Postgres desechable. La instancia real de producción vive en
# EasyPanel (docs/LICENSING_PLAN.md, Pieza 6) y nunca se referencia desde este archivo.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gvrlicense_dev
      POSTGRES_PASSWORD: gvrlicense_dev
      POSTGRES_DB: gvrlicense_dev
    ports:
      - "5432:5432"
    volumes:
      - gvrlicense_dev_data:/var/lib/postgresql/data

volumes:
  gvrlicense_dev_data:
